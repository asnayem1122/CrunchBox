<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <defs>
    <pattern id="adaptive-bg-grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M 32 0 L 0 0 0 32" fill="none" stroke="#1B241E" stroke-width="1.2" stroke-opacity="0.12" />
    </pattern>
    <radialGradient id="vignette" cx="50%" cy="50%" r="50%">
      <stop offset="60%" stop-color="#D5DBD2" stop-opacity="0" />
      <stop offset="100%" stop-color="#1B241E" stop-opacity="0.2" />
    </radialGradient>
  </defs>

  <!-- Full Canvas Chassis Putty -->
  <rect width="1024" height="1024" fill="#D5DBD2" />
  <rect width="1024" height="1024" fill="url(#adaptive-bg-grid)" />
  <rect width="1024" height="1024" fill="url(#vignette)" />

  <!-- Tactical Crosshairs / Edge Marks -->
  <g stroke="#1B241E" stroke-width="4" stroke-opacity="0.25">
    <line x1="512" y1="20" x2="512" y2="80" />
    <line x1="512" y1="944" x2="512" y2="1004" />
    <line x1="20" y1="512" x2="80" y2="512" />
    <line x1="944" y1="512" x2="1004" y2="512" />
  </g>
</svg>
