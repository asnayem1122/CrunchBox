<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <defs>
    <!-- Shadow filters and gradients -->
    <filter id="chassis-shadow" x="-5%" y="-5%" width="120%" height="120%">
      <feDropShadow dx="0" dy="28" stdDeviation="0" flood-color="#161D18" flood-opacity="1" />
    </filter>
    <pattern id="chassis-grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#2D3B31" stroke-width="1.5" stroke-opacity="0.12" />
    </pattern>
  </defs>

  <!-- Outer Canvas / Chassis Plate -->
  <rect width="1024" height="1024" rx="192" fill="#D5DBD2" stroke="#1B241E" stroke-width="28" />
  <rect width="1024" height="1024" rx="192" fill="url(#chassis-grid)" />

  <!-- Hardware Corner Screws (Tactile Hex Screws) -->
  <!-- Top Left -->
  <g transform="translate(130, 130)">
    <circle r="44" fill="#B0BAAA" stroke="#1B241E" stroke-width="14" />
    <circle r="26" fill="#D99E32" stroke="#1B241E" stroke-width="8" />
    <line x1="-18" y1="-18" x2="18" y2="18" stroke="#1B241E" stroke-width="10" stroke-linecap="round" />
  </g>
  <!-- Top Right -->
  <g transform="translate(894, 130)">
    <circle r="44" fill="#B0BAAA" stroke="#1B241E" stroke-width="14" />
    <circle r="26" fill="#D99E32" stroke="#1B241E" stroke-width="8" />
    <line x1="-18" y1="18" x2="18" y2="-18" stroke="#1B241E" stroke-width="10" stroke-linecap="round" />
  </g>
  <!-- Bottom Left -->
  <g transform="translate(130, 894)">
    <circle r="44" fill="#B0BAAA" stroke="#1B241E" stroke-width="14" />
    <circle r="26" fill="#D99E32" stroke="#1B241E" stroke-width="8" />
    <line x1="-22" y1="0" x2="22" y2="0" stroke="#1B241E" stroke-width="10" stroke-linecap="round" />
  </g>
  <!-- Bottom Right -->
  <g transform="translate(894, 894)">
    <circle r="44" fill="#B0BAAA" stroke="#1B241E" stroke-width="14" />
    <circle r="26" fill="#D99E32" stroke="#1B241E" stroke-width="8" />
    <line x1="0" y1="-22" x2="0" y2="22" stroke="#1B241E" stroke-width="10" stroke-linecap="round" />
  </g>

  <!-- Hazard Stripes Accent Bar (Top Edge) -->
  <g transform="translate(262, 90)">
    <rect width="500" height="24" rx="8" fill="#D99E32" stroke="#1B241E" stroke-width="8" />
    <!-- Diagonal Stripes -->
    <path d="M 40,0 L 70,24 M 100,0 L 130,24 M 160,0 L 190,24 M 220,0 L 250,24 M 280,0 L 310,24 M 340,0 L 370,24 M 400,0 L 430,24 M 460,0 L 490,24" stroke="#1B241E" stroke-width="12" stroke-linecap="square" />
  </g>

  <!-- Big Tactile 3D Keycap Face (Centerpiece) -->
  <!-- 3D Shadow Layer (Extrusion Bottom) -->
  <rect x="212" y="272" width="600" height="520" rx="64" fill="#1B241E" />
  <rect x="212" y="252" width="600" height="520" rx="64" fill="#2E3B33" stroke="#1B241E" stroke-width="20" />
  
  <!-- Main Keycap Top Surface -->
  <rect x="212" y="222" width="600" height="510" rx="64" fill="#425246" stroke="#1B241E" stroke-width="24" />

  <!-- Recessed Inner Keycap Chamfer / Plate -->
  <rect x="248" y="258" width="528" height="438" rx="44" fill="#313E34" stroke="#1B241E" stroke-width="14" />

  <!-- Sage LCD Display Inset Window -->
  <g transform="translate(284, 294)">
    <!-- LCD Bezel 3D Shadow -->
    <rect x="0" y="8" width="456" height="200" rx="24" fill="#161D18" />
    <!-- LCD Glass Face -->
    <rect x="0" y="0" width="456" height="200" rx="24" fill="#8FA893" stroke="#1B241E" stroke-width="16" />
    <!-- Pixel Matrix Scanlines subtle -->
    <line x1="20" y1="40" x2="436" y2="40" stroke="#7E9682" stroke-width="2" />
    <line x1="20" y1="80" x2="436" y2="80" stroke="#7E9682" stroke-width="2" />
    <line x1="20" y1="120" x2="436" y2="120" stroke="#7E9682" stroke-width="2" />
    <line x1="20" y1="160" x2="436" y2="160" stroke="#7E9682" stroke-width="2" />

    <!-- LCD Annunciator Micro Labels -->
    <text x="32" y="44" font-family="monospace" font-size="22" font-weight="900" fill="#1B241E" opacity="0.8">RAD</text>
    <text x="110" y="44" font-family="monospace" font-size="22" font-weight="900" fill="#1B241E" opacity="0.8">HEX</text>
    <text x="350" y="44" font-family="monospace" font-size="22" font-weight="900" fill="#1B241E" opacity="0.8">64-BIT</text>

    <!-- Main Bold LCD Readout -->
    <text x="228" y="145" text-anchor="middle" font-family="monospace" font-size="88" font-weight="900" fill="#1B241E" letter-spacing="6">CB•09</text>
  </g>

  <!-- Tactile Push Button Array (Below LCD inside Keycap) -->
  <!-- Button 1 (Math Operator Accent: Orange) -->
  <g transform="translate(290, 534)">
    <rect x="0" y="12" width="124" height="124" rx="28" fill="#1B241E" />
    <rect x="0" y="0" width="124" height="124" rx="28" fill="#D96B27" stroke="#1B241E" stroke-width="14" />
    <!-- Plus symbol -->
    <path d="M 62,38 L 62,86 M 38,62 L 86,62" stroke="#FFFFFF" stroke-width="16" stroke-linecap="round" />
  </g>

  <!-- Button 2 (ALU / Logic Accent: Olive Light) -->
  <g transform="translate(450, 534)">
    <rect x="0" y="12" width="124" height="124" rx="28" fill="#1B241E" />
    <rect x="0" y="0" width="124" height="124" rx="28" fill="#8FA893" stroke="#1B241E" stroke-width="14" />
    <!-- Logic Gate / Bitwise XOR symbol -->
    <text x="62" y="80" text-anchor="middle" font-family="monospace" font-size="64" font-weight="900" fill="#1B241E">⊻</text>
  </g>

  <!-- Button 3 (Execute Accent: Field Gold) -->
  <g transform="translate(610, 534)">
    <rect x="0" y="12" width="124" height="124" rx="28" fill="#1B241E" />
    <rect x="0" y="0" width="124" height="124" rx="28" fill="#D99E32" stroke="#1B241E" stroke-width="14" />
    <!-- Equal symbol -->
    <path d="M 40,50 L 84,50 M 40,74 L 84,74" stroke="#1B241E" stroke-width="16" stroke-linecap="round" />
  </g>

  <!-- Stenciled Chassis Label (Bottom Plate) -->
  <g transform="translate(512, 836)">
    <text text-anchor="middle" font-family="monospace" font-size="34" font-weight="900" fill="#1B241E" letter-spacing="8">CRUNCHBOX // CB-09</text>
    <text text-anchor="middle" y="44" font-family="monospace" font-size="20" font-weight="800" fill="#2E3B33" letter-spacing="4">HEAVY-DUTY FIELD GEAR</text>
  </g>
</svg>
